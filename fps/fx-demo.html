<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>⚓ 항만 작전 — FX 데모 (효과음·이펙트)</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg: #0b1622; --panel: rgba(9, 22, 36, 0.92); --line: #23415e; --fg: #e7eef5; --mut: #8fa6bb; --acc: #f4a261; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, "Malgun Gothic", sans-serif; overflow: hidden; }
  #view { position: fixed; inset: 0; display: block; }
  #panel { position: fixed; top: 0; left: 0; bottom: 0; width: 330px; overflow-y: auto; padding: 12px 14px 20px;
    background: var(--panel); border-right: 1px solid var(--line); }
  h1 { font-size: 15px; margin: 0 0 4px; }
  .hint { color: var(--mut); font-size: 12px; margin: 0 0 8px; }
  h2 { font-size: 12px; color: var(--acc); margin: 12px 0 6px; letter-spacing: .02em; }
  .grid { display: flex; flex-wrap: wrap; gap: 4px; }
  button { background: #12304c; color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px;
    font: inherit; font-size: 12px; cursor: pointer; }
  button:hover { background: #1b4468; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--acc); outline-offset: 1px; }
  .row { display: flex; align-items: center; gap: 6px; margin: 4px 0; flex-wrap: wrap; }
  label { color: var(--mut); font-size: 12px; }
  select, input[type=range] { accent-color: var(--acc); }
  select { background: #12304c; color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 3px 4px; font: inherit; font-size: 12px; }
  #stats { position: fixed; right: 10px; top: 10px; margin: 0; padding: 8px 10px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; font: 11px/1.45 ui-monospace, Consolas, monospace; color: #cfe3f5; white-space: pre; pointer-events: none; }
  #cross { position: fixed; left: calc(50% + 165px); top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px; pointer-events: none;
    border: 1px solid rgba(255,255,255,.7); border-radius: 50%; }
  @media (max-width: 700px) { #panel { width: 100%; bottom: auto; max-height: 45vh; } #cross { left: 50%; } }
</style>
<script type="importmap">{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
  "@supabase/supabase-js":"https://esm.sh/@supabase/supabase-js@2.45.4"
}}</script>
</head>
<body>
<canvas id="view" aria-label="이펙트 미리보기 3D 장면"></canvas>
<div id="cross" aria-hidden="true"></div>
<aside id="panel">
  <h1>⚓ 항만 작전 — FX 데모</h1>
  <p class="hint">버튼으로 효과음·이펙트를 실행합니다. 장면을 클릭하면 그 지점 재질에 맞는 피격 이펙트가 납니다. 드래그로 시점 회전.</p>
  <div class="row">
    <label for="vol">볼륨</label><input id="vol" type="range" min="0" max="1" step="0.01" value="0.8">
  </div>
  <div class="row">
    <label for="where">소리 위치</label>
    <select id="where">
      <option value="self">내 소리(2D)</option><option value="front">앞</option><option value="left">왼쪽</option>
      <option value="right">오른쪽</option><option value="behind">뒤</option>
    </select>
    <label for="dist">거리 <span id="distv">15</span>m</label><input id="dist" type="range" min="2" max="200" step="1" value="15">
  </div>
  <div id="sounds"></div>
  <h2>이펙트</h2>
  <div class="grid" id="effects"></div>
  <h2>설정</h2>
  <div class="row">
    <label for="qual">품질</label>
    <select id="qual"><option value="high">high</option><option value="low">low</option></select>
    <label for="rm">동작 줄이기</label>
    <select id="rm"><option value="os">OS 설정</option><option value="on">켜기</option><option value="off">끄기</option></select>
  </div>
</aside>
<pre id="stats" aria-live="off"></pre>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { createAudio, SOUND_NAMES } from './js/fx/audio.js';
import { createEffects } from './js/fx/effects.js';

const SMOKE = new URLSearchParams(location.search).has('smoke');
const canvas = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.setSize(innerWidth, innerHeight);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fb4c4);
scene.fog = new THREE.Fog(0x9fb4c4, 40, 160);
const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.05, 400);
camera.position.set(0, 1.6, 7);
scene.add(new THREE.HemisphereLight(0xdfeaf5, 0x3a3a3a, 1.4));
const sun = new THREE.DirectionalLight(0xffe2bd, 1.6); sun.position.set(-6, 10, 4); scene.add(sun);

// 간단한 바닥·벽: userData.mat = ARCHITECTURE 재질 팔레트
const solids = [];
function box(w, h, d, x, y, z, color, mat, extra = {}) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshLambertMaterial({ color, ...extra }));
  m.position.set(x, y + h / 2, z); m.userData.mat = mat; scene.add(m); solids.push(m); return m;
}
box(60, 0.2, 60, 0, -0.2, 0, 0x8d8a84, 'concrete');
box(10, 4, 0.4, 0, 0, -9, 0x56687a, 'steel');
box(0.5, 3, 8, -9, 0, -3, 0xa7a199, 'concrete');
box(2.4, 2.6, 6, 7, 0, -7, 0xa63d2f, 'container_red');
box(1.2, 1.2, 1.2, 3, 0, -4, 0x9a7148, 'wood');
box(2, 1.6, 0.06, -3, 0.6, -5, 0xbfe3f0, 'glass', { transparent: true, opacity: 0.35 });
const water = new THREE.Mesh(new THREE.PlaneGeometry(14, 14), new THREE.MeshLambertMaterial({ color: 0x1d3557 }));
water.rotation.x = -Math.PI / 2; water.position.set(0, 0.02, 9); water.userData.mat = 'water';
scene.add(water); solids.push(water);

const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 1.2, -3); controls.enableDamping = true; controls.update();

const audio = createAudio({ volume: 0.8 });
const fx = createEffects(scene, camera, { renderer });

/* ── 유틸 ── */
const fwd = new THREE.Vector3(), right = new THREE.Vector3(), up = new THREE.Vector3(), eul = new THREE.Euler();
function basis() {
  camera.getWorldDirection(fwd);
  right.crossVectors(fwd, camera.up).normalize();
  up.crossVectors(right, fwd).normalize();
}
function gunPos() { basis(); return camera.position.clone().addScaledVector(right, 0.22).addScaledVector(up, -0.18).addScaledVector(fwd, 0.6); }
const ray = new THREE.Raycaster();
function aimHit(ndc = new THREE.Vector2(0, 0)) {
  ray.setFromCamera(ndc, camera);
  const h = ray.intersectObjects(solids, false)[0];
  if (!h) return null;
  const n = h.face ? h.face.normal.clone().transformDirection(h.object.matrixWorld) : new THREE.Vector3(0, 1, 0);
  return { point: h.point, normal: n, mat: h.object.userData.mat };
}
function soundPos() {
  const where = document.getElementById('where').value, d = +document.getElementById('dist').value;
  if (where === 'self') return undefined;
  basis();
  const dir = { front: fwd, left: right.clone().negate(), right, behind: fwd.clone().negate() }[where];
  return camera.position.clone().addScaledVector(dir, d);
}
const unlock = () => audio.unlock();
const wait = (ms) => new Promise((r) => setTimeout(r, ms));

/* ── 효과음 버튼 ── */
const GROUPS = [
  ['사격·무기', ['rifle', 'sniper', 'pistol', 'knife_slash', 'knife_hit', 'grenade_pin', 'grenade_bounce', 'explosion',
    'reload_mag_out', 'reload_mag_in', 'bolt', 'dry_fire', 'switch']],
  ['발소리', ['footstep_concrete', 'footstep_steel']],
  ['피드백', ['hit_marker', 'headshot', 'kill']],
  ['라운드·상태', ['round_start', 'round_win', 'round_lose', 'low_hp_heartbeat']]
];
const sbox = document.getElementById('sounds');
for (const [title, names] of GROUPS) {
  const h = document.createElement('h2'); h.textContent = title; sbox.appendChild(h);
  const g = document.createElement('div'); g.className = 'grid'; sbox.appendChild(g);
  for (const n of names) {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = n; b.dataset.sound = n;
    b.addEventListener('click', async () => { await unlock(); audio.play(n, { pos: soundPos() }); });
    g.appendChild(b);
  }
}

/* ── 이펙트 버튼 ── */
function shoot(kind, withSound = true) {
  basis();
  const g = gunPos(), hit = aimHit();
  fx.muzzleFlash(g, fwd, kind);
  const to = hit ? hit.point : camera.position.clone().addScaledVector(fwd, 120);
  fx.tracer(g, to, kind);
  if (hit) fx.impact(hit.point, hit.normal, hit.mat);
  if (kind !== 'sniper') fx.shellEject(g, fwd, { groundY: 0 });
  if (withSound) audio.play(kind);
}
async function burst() { for (let i = 0; i < 10; i++) { shoot('rifle'); await wait(100); } }
async function grenade() {
  const p = new THREE.Vector3(1.5, 0, -3);
  audio.play('grenade_pin');
  await wait(450); audio.play('grenade_bounce', { pos: p.clone().setY(0.1) });
  await wait(380); audio.play('grenade_bounce', { pos: p, gain: 0.6 });
  await wait(900); fx.explosion(p); audio.play('explosion', { pos: p });
}
async function orbit() {                                  // HRTF 확인: 소리가 머리 주위를 한 바퀴 돈다
  for (let i = 0; i < 12; i++) {
    const a = (i / 12) * Math.PI * 2;
    audio.play('footstep_steel', { pos: camera.position.clone().add(new THREE.Vector3(Math.sin(a) * 4, -1.5, -Math.cos(a) * 4)) });
    await wait(260);
  }
}
const EFFECTS = [
  ['총구 섬광: 소총', () => { basis(); fx.muzzleFlash(gunPos(), fwd, 'rifle'); }],
  ['총구 섬광: 저격', () => { basis(); fx.muzzleFlash(gunPos(), fwd, 'sniper'); }],
  ['총구 섬광: 권총', () => { basis(); fx.muzzleFlash(gunPos(), fwd, 'pistol'); }],
  ['사격: 소총', () => shoot('rifle')], ['사격: 저격', () => shoot('sniper')], ['사격: 권총', () => shoot('pistol')],
  ['연사 1초', burst],
  ['피격: 강판', () => fx.impact(new THREE.Vector3(rnd(-3, 3), rnd(0.5, 3), -8.8), new THREE.Vector3(0, 0, 1), 'steel')],
  ['피격: 콘크리트', () => fx.impact(new THREE.Vector3(-8.75, rnd(0.5, 2.5), rnd(-6, 0)), new THREE.Vector3(1, 0, 0), 'concrete')],
  ['피격: 물', () => fx.impact(new THREE.Vector3(rnd(-3, 3), 0.02, rnd(5, 8)), new THREE.Vector3(0, 1, 0), 'water')],
  ['피격: 나무', () => fx.impact(new THREE.Vector3(3, rnd(0.2, 1.1), -3.4), new THREE.Vector3(0, 0, 1), 'wood')],
  ['피격: 유리', () => fx.impact(new THREE.Vector3(-3, rnd(0.8, 2), -4.97), new THREE.Vector3(0, 0, 1), 'glass')],
  ['피격: 플레이어', () => fx.impact(new THREE.Vector3(0, 1.3, -2), new THREE.Vector3(0, 0, 1), 'player')],
  ['폭발', () => { const p = new THREE.Vector3(rnd(-2, 2), 0, -4); fx.explosion(p); audio.play('explosion', { pos: p }); }],
  ['수류탄 시퀀스', grenade],
  ['탄피', () => { basis(); fx.shellEject(gunPos(), fwd, { groundY: 0 }); }],
  ['3D 발소리 회전', orbit],
  ['모두 지우기', () => fx.clear()]
];
function rnd(a, b) { return a + (b - a) * Math.random(); }
const ebox = document.getElementById('effects');
for (const [label, fn] of EFFECTS) {
  const b = document.createElement('button'); b.type = 'button'; b.textContent = label;
  b.addEventListener('click', async () => { await unlock(); fn(); });
  ebox.appendChild(b);
}

/* ── 설정 ── */
document.getElementById('vol').addEventListener('input', (e) => audio.setVolume(+e.target.value));
document.getElementById('dist').addEventListener('input', (e) => { document.getElementById('distv').textContent = e.target.value; });
document.getElementById('qual').addEventListener('change', (e) => { fx.setQuality(e.target.value); audio.setQuality(e.target.value); });
document.getElementById('rm').addEventListener('change', (e) => fx.setReducedMotion(e.target.value === 'os' ? null : e.target.value === 'on'));
let downAt = null;
canvas.addEventListener('pointerdown', (e) => { downAt = [e.clientX, e.clientY]; unlock(); });
canvas.addEventListener('pointerup', (e) => {                                          // 드래그가 아닌 클릭 → 피격
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 4) return;
  const ndc = new THREE.Vector2((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  const h = aimHit(ndc);
  if (h) { fx.impact(h.point, h.normal, h.mat); audio.play('hit_marker'); }
});
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

/* ── 루프 ── */
const statsEl = document.getElementById('stats');
let last = performance.now(), acc = 0, frames = 0, fps = 0;
function frame(now) {
  if (!running) return;
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  controls.update();
  eul.setFromQuaternion(camera.quaternion, 'YXZ');
  audio.setListener(camera.position, eul.y, eul.x);
  fx.update(dt);
  renderer.render(scene, camera);
  frames++; acc += dt;
  if (acc >= 0.25) {
    fps = Math.round(frames / acc); frames = 0; acc = 0;
    const s = fx.getStats(), a = audio.getStats();
    statsEl.textContent = `fps ${fps}\nparticles ${s.particles}/${s.particleCap}  streaks ${s.streaks}/${s.streakCap}\n` +
      `flash ${s.flashes} tracer ${s.tracers} ring ${s.rings} burst ${s.bursts}\nlights ${s.lights}/2 shells ${s.shells} decals ${s.decals}\n` +
      `dropped ${s.dropped}  quality ${s.quality}  rm ${s.reducedMotion}\n` +
      `audio ${a.state}  3D ${a.voices3d}/${a.pool3d}  2D ${a.voices2d}/${a.pool2d}  cached ${a.cached}\n` +
      `draw calls ${renderer.info.render.calls}`;
  }
  requestAnimationFrame(frame);
}
let running = !SMOKE;
if (running) requestAnimationFrame(frame);

/* ── 스모크 테스트(?smoke): 오류 0건 · 풀 누수 없음 확인 ── */
async function smoke() {
  const res = { ok: false, checks: [] };
  const check = (name, ok, info) => res.checks.push({ name, ok: !!ok, info });
  const step = (sec) => { for (let i = 0, n = Math.round(sec * 60); i < n; i++) { fx.update(1 / 60); if (i % 20 === 0) renderer.render(scene, camera); } };
  const zero = (s) => s.particles === 0 && s.streaks === 0 && s.flashes === 0 && s.tracers === 0 && s.rings === 0 &&
    s.bursts === 0 && s.lights === 0 && s.shells === 0;
  const MATS = ['steel', 'rust', 'deck', 'tank', 'pipe', 'container_red', 'yellow', 'white', 'concrete', 'asphalt', 'grass', 'wood', 'glass', 'water', 'player', 'unknown'];
  const spawnAll = (k = 1) => {
    basis();
    for (let i = 0; i < 10 * k; i++) for (const kind of ['rifle', 'sniper', 'pistol', 'nor-1']) {
      fx.muzzleFlash(gunPos(), fwd, kind); fx.tracer(gunPos(), new THREE.Vector3(rnd(-4, 4), rnd(0.2, 3), -8.8), kind);
    }
    for (let i = 0; i < 6 * k; i++) for (const m of MATS) fx.impact(new THREE.Vector3(rnd(-4, 4), rnd(0, 3), -8.8), new THREE.Vector3(0, 0, 1), m);
    for (let i = 0; i < 4 * k; i++) fx.explosion(new THREE.Vector3(rnd(-3, 3), 0, rnd(-6, -2)));
    for (let i = 0; i < 30 * k; i++) fx.shellEject(gunPos(), fwd, { groundY: 0 });
    fx.impact([0, 0, 0], null, 'concrete'); fx.tracer({ x: 0, y: 1, z: 0 }, [0, 1, 0]); // 경계 입력
  };
  try {
    renderer.render(scene, camera);
    const objs0 = scene.children.length, fxObjs0 = fx.getStats().objects, rot0 = camera.rotation.clone();
    const mem = [];
    for (let cycle = 0; cycle < 3; cycle++) {
      spawnAll(cycle === 2 ? 4 : 1);                       // 3번째는 상한을 넘기는 과부하
      const peak = fx.getStats();
      check(`c${cycle} caps`, peak.particles <= peak.particleCap && peak.streaks <= peak.streakCap && peak.lights <= 2, peak);
      step(7);
      const after = fx.getStats();
      check(`c${cycle} drained`, zero(after), after);
      mem.push({ geo: renderer.info.memory.geometries, tex: renderer.info.memory.textures, prog: renderer.info.programs.length });
    }
    check('no GPU resource growth', mem[1].geo === mem[0].geo && mem[2].geo === mem[0].geo && mem[2].tex === mem[0].tex && mem[2].prog === mem[0].prog, mem);
    check('overload dropped (cap enforced)', fx.getStats().dropped > 0, fx.getStats().dropped);
    check('scene children stable', scene.children.length === objs0 && fx.getStats().objects === fxObjs0, scene.children.length);
    check('decals ring-buffer capped', fx.getStats().decals <= 96, fx.getStats().decals);
    check('shake restored camera', Math.abs(camera.rotation.x - rot0.x) < 1e-9 && Math.abs(camera.rotation.y - rot0.y) < 1e-9 &&
      Math.abs(camera.rotation.z - rot0.z) < 1e-9, [camera.rotation.x - rot0.x, camera.rotation.y - rot0.y]);
    fx.setQuality('low'); spawnAll(2);
    const low = fx.getStats();
    check('low quality caps', low.particles <= 1000 && low.streaks <= 96 && low.decals <= 32, low);
    step(7); check('low drained', zero(fx.getStats()), fx.getStats()); fx.setQuality('high');
    fx.setReducedMotion(true); fx.explosion([0, 0, -3]); check('reduced motion flag', fx.getStats().reducedMotion, true);
    step(7); fx.setReducedMotion(null); check('rm drained', zero(fx.getStats()), fx.getStats());
    const gl = renderer.getContext();
    check('gl.getError() == 0', gl.getError() === 0, gl.getError());

    // 오디오
    const unlocked = await audio.unlock();
    check('audio unlock', unlocked, audio.getStats());
    let p2 = 0, p3 = 0;
    for (const n of SOUND_NAMES) if (audio.play(n)) p2++;
    const s2 = audio.getStats();
    check('2D voices capped', s2.voices2d <= s2.pool2d && p2 >= s2.pool2d, { played: p2, ...s2 });
    for (const n of SOUND_NAMES) if (audio.play(n, { pos: [rnd(-30, 30), 1, rnd(-60, -5)] })) p3++;
    for (let i = 0; i < 40; i++) audio.play('footstep_steel', { pos: [rnd(-5, 5), 0, rnd(-5, 5)] });
    for (let i = 0; i < 40; i++) audio.play('rifle', { pos: [rnd(-150, 150), 1, -200] });
    const s3 = audio.getStats();
    check('3D voices capped', s3.voices3d <= s3.pool3d, { played3d: p3, ...s3 });
    check('out-of-range culled', audio.play('footstep_concrete', { pos: [0, 0, -500] }) === null, null);
    check('unknown sound ignored', audio.play('nope') === null, null);
    audio.setListener({ x: 0, y: 1.6, z: 0 }, 0.5, -0.2); audio.setVolume(0.5);
    await wait(4200);                                      // 가장 긴 소리(폭발 3.6s)보다 길게
    const s4 = audio.getStats();
    check('audio voices released', s4.voices3d === 0 && s4.voices2d === 0, s4);
    check('all sounds synthesized', s4.cached === SOUND_NAMES.length, s4.cached);

    fx.dispose(); audio.dispose();
    check('fx disposed', !scene.getObjectByName('fx-root'), scene.children.length);
    check('audio disposed', audio.getStats().state === 'locked' && audio.play('rifle') === null, audio.getStats());
    res.ok = res.checks.every((c) => c.ok);
  } catch (err) {
    check('exception', false, String(err && err.stack || err));
  }
  res.renderInfo = { ...renderer.info.memory, programs: renderer.info.programs.length };
  window.__fxSmoke = res;                                   // ?smoke 모드에서만 노출
  document.title = res.ok ? 'SMOKE PASS' : 'SMOKE FAIL';
}
if (SMOKE) smoke();
</script>
</body>
</html>
